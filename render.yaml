services:
  - type: web
    name: orchard-advisory-backend
    runtime: python
    rootDir: orchard-advisory-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: DATABASE_URL
        value: sqlite:///./orchard.db
      # After GitHub Pages is live, tighten this to:
      # https://alibarkat726.github.io
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"
