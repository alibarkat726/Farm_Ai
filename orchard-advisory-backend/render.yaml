services:
  - type: web
    name: orchard-advisory-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: DATABASE_URL
        value: sqlite:///./orchard.db
      - key: ALLOWED_ORIGINS
        value: "*"
